name: mt5-phones

# Cap container logs so they cannot fill the disk: at most 3 files of 10 MB per container.
x-logging: &logging
  driver: json-file
  options: {max-size: "10m", max-file: "3"}

services:
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    logging: *logging
    ports: ["80:80", "443:443"]
    environment:
      DASHBOARD_HOST: ${DASHBOARD_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

  api:
    build: ../server
    restart: unless-stopped
    logging: *logging
    environment:
      MT5_DATABASE_URL: postgresql+asyncpg://mt5:${POSTGRES_PASSWORD}@db:5432/mt5
      MT5_REDIS_URL: redis://cache:6379/0
      MT5_PUBLIC_URL: https://${DASHBOARD_HOST}
      # Allow reaching the dashboard by the domain (HTTPS) and by the public IP (HTTP) both.
      MT5_EXTRA_ALLOWED_ORIGINS: '["http://${PUBLIC_IP}","http://${PUBLIC_IP}:80"]'
      # Admins/superusers must turn on 2FA. Set REQUIRE_ADMIN_2FA=false only to recover access.
      MT5_REQUIRE_ADMIN_2FA: "${REQUIRE_ADMIN_2FA:-true}"
      # false so login works over plain HTTP by IP too (cookies aren't HTTPS-only). Set to "true"
      # if you will only ever use the HTTPS domain.
      MT5_COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      MT5_TURN_SECRET: ${TURN_SECRET}
      # IP-based TURN only: the agent connects to the backend by public IP, and video relays over it.
      MT5_TURN_URLS: '["turn:${PUBLIC_IP}:3478?transport=udp","turn:${PUBLIC_IP}:3478?transport=tcp"]'
      MT5_TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      MT5_TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - apk:/data/apk
    depends_on:
      db: {condition: service_healthy}
      cache: {condition: service_healthy}

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_USER: mt5
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mt5
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mt5"]
      interval: 10s

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  turn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    logging: *logging
    network_mode: host
    user: root
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET}
      - --realm=mt5
      - --external-ip=${PUBLIC_IP}
      - --no-tls
      - --no-dtls

volumes:
  apk:
  pgdata:
  caddy_data:
  caddy_config:
