name: mt5-phones

services:
  web:
    build:
      context: ..
      dockerfile: deploy/web.Dockerfile
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN}
      DASHBOARD_HOST: ${DASHBOARD_HOST}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [api]

  api:
    build: ../server
    restart: unless-stopped
    environment:
      MT5_DATABASE_URL: postgresql+asyncpg://mt5:${POSTGRES_PASSWORD}@db:5432/mt5
      MT5_REDIS_URL: redis://cache:6379/0
      MT5_PUBLIC_URL: https://${DASHBOARD_HOST}
      # Allow reaching the dashboard by the domain (HTTPS) and by the public IP (HTTP) both.
      MT5_EXTRA_ALLOWED_ORIGINS: '["http://${PUBLIC_IP}","http://${PUBLIC_IP}:80"]'
      # false so login works over plain HTTP by IP too (cookies aren't HTTPS-only). Set to "true"
      # if you will only ever use the HTTPS domain.
      MT5_COOKIE_SECURE: "${COOKIE_SECURE:-false}"
      MT5_TURN_SECRET: ${TURN_SECRET}
      # Domain-based TURN (TLS on 5349) for internet clients, plus IP-based for direct/LAN clients.
      MT5_TURN_URLS: '["turns:turn.${DOMAIN}:5349?transport=tcp","turn:turn.${DOMAIN}:3478?transport=udp","turn:turn.${DOMAIN}:3478?transport=tcp","turn:${PUBLIC_IP}:3478?transport=udp","turn:${PUBLIC_IP}:3478?transport=tcp"]'
      MT5_TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      MT5_TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - apk:/data/apk
    depends_on:
      db: {condition: service_healthy}
      cache: {condition: service_healthy}

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: mt5
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mt5
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mt5"]
      interval: 10s

  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  turn:
    image: coturn/coturn:4.6.3
    restart: unless-stopped
    network_mode: host
    # Root is needed to read Caddy's certificate files from the shared volume.
    user: root
    volumes:
      - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
      - caddy_data:/caddy-data:ro
    command:
      - -c
      - /etc/coturn/turnserver.conf
      - --static-auth-secret=${TURN_SECRET}
      - --realm=turn.${DOMAIN}
      - --external-ip=${PUBLIC_IP}
      - --cert=/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/turn.${DOMAIN}/turn.${DOMAIN}.crt
      - --pkey=/caddy-data/caddy/certificates/acme-v02.api.letsencrypt.org-directory/turn.${DOMAIN}/turn.${DOMAIN}.key

volumes:
  apk:
  pgdata:
  caddy_data:
  caddy_config:
