# coturn for the MT5 phone platform. Secret, realm, IP and certificate paths come from
# command-line flags in docker-compose.yml.
listening-port=3478
tls-listening-port=5349
min-port=49160
max-port=49200

use-auth-secret
fingerprint
no-cli
no-multicast-peers
no-tlsv1
no-tlsv1_1

# Relay only to public addresses; never into the VPC or the host.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255

total-quota=40
stale-nonce=600
log-file=stdout
simple-log
